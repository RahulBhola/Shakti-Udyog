<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%" style="background-color: #121316; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Container (Admin Analytics UI) -->
  <rect x="40" y="30" width="630" height="740" rx="10" fill="#222429" stroke="#383b42" stroke-width="1.5"/>
  <text x="60" y="62" fill="#9ca3af" font-size="14" font-weight="600" letter-spacing="0.5">Admin Analytics UI (AdminDashboardPage &amp; AdminCharts)</text>

  <!-- Right Container (Backend API) -->
  <rect x="710" y="30" width="650" height="740" rx="10" fill="#222429" stroke="#383b42" stroke-width="1.5"/>
  <text x="730" y="62" fill="#9ca3af" font-size="14" font-weight="600" letter-spacing="0.5">Backend API (AdminController &amp; DbContext)</text>

  <!-- Left Side Connections -->
  <!-- Curves from Timeframe Selector (cx: 260, cy: 400) to Left Target Cards -->
  <path d="M 260 400 C 310 400, 310 115, 360 115" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="115" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 205, 360 205" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="205" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 295, 360 295" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="295" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 395, 360 395" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="395" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 495, 360 495" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="495" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 595, 360 595" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="595" r="3.5" fill="#9ca3af"/>

  <path d="M 260 400 C 310 400, 310 695, 360 695" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="360" cy="695" r="3.5" fill="#9ca3af"/>

  <!-- Left Side: Root Card -->
  <g filter="url(#card-shadow)">
    <rect x="65" y="365" width="195" height="70" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="162" y="396" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Timeframe Selector:</text>
    <text x="162" y="416" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">30D | 90D | 12M | All Time</text>
  </g>

  <!-- Left Side: Target Cards -->
  <!-- Target 1: Badges -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="80" width="280" height="70" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="106" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Executive Metric Badges:</text>
    <text x="500" y="124" fill="#9ca3af" font-size="11.5" text-anchor="middle">OTD 97.2% | Yield 89.5% |</text>
    <text x="500" y="140" fill="#9ca3af" font-size="11.5" text-anchor="middle">Win Rate 44% | Lead Time 14.5d</text>
  </g>

  <!-- Target 2: MES Breakdown -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="175" width="280" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="202" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">1. MES Manufacturing</text>
    <text x="500" y="222" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Kanban Stage Breakdown</text>
  </g>

  <!-- Target 3: Metallurgy Mix -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="265" width="280" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="292" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">2. Metallurgy &amp; Casting</text>
    <text x="500" y="312" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Grade Mix (Donut)</text>
  </g>

  <!-- Target 4: Cashflow Velocity -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="360" width="280" height="70" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="388" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">3. Revenue vs Realized</text>
    <text x="500" y="406" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Cashflow Velocity (Dual Area)</text>
  </g>

  <!-- Target 5: Pipeline Bar -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="465" width="280" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="492" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">4. Monthly Commercial</text>
    <text x="500" y="512" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Pipeline (Grouped Bar)</text>
  </g>

  <!-- Target 6: Industry Distribution -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="560" width="280" height="70" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="588" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">5. Industry Sector Revenue</text>
    <text x="500" y="606" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Distribution (Horizontal Bars)</text>
  </g>

  <!-- Target 7: Order Fulfillment -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="665" width="280" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="500" y="692" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">6. Order Fulfillment &amp;</text>
    <text x="500" y="712" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Delivery Status (Donut)</text>
  </g>


  <!-- Right Side Connections -->
  <!-- Curves from Backend GET API (cx: 935, cy: 400) to Right Target Cards -->
  <path d="M 935 400 C 985 400, 985 140, 1035 140" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="140" r="3.5" fill="#9ca3af"/>

  <path d="M 935 400 C 985 400, 985 240, 1035 240" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="240" r="3.5" fill="#9ca3af"/>

  <path d="M 935 400 C 985 400, 985 345, 1035 345" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="345" r="3.5" fill="#9ca3af"/>

  <path d="M 935 400 C 985 400, 985 455, 1035 455" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="455" r="3.5" fill="#9ca3af"/>

  <path d="M 935 400 C 985 400, 985 565, 1035 565" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="565" r="3.5" fill="#9ca3af"/>

  <path d="M 935 400 C 985 400, 985 675, 1035 675" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1035" cy="675" r="3.5" fill="#9ca3af"/>

  <!-- Right Side: Root Card -->
  <g filter="url(#card-shadow)">
    <rect x="740" y="365" width="195" height="70" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="837" y="396" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">GET /api/v1/admin/charts?</text>
    <text x="837" y="416" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">range=12m</text>
  </g>

  <!-- Right Side: Target Cards -->
  <!-- Target 1: Orders by MES -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="110" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="137" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Orders by 25-Stage MES</text>
    <text x="1182" y="155" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Kanban</text>
  </g>

  <!-- Target 2: Metallurgy Mix -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="210" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="237" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Material &amp; Metallurgy</text>
    <text x="1182" y="255" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Grade Mix (FG vs SG)</text>
  </g>

  <!-- Target 3: Invoiced vs Collected -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="315" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="342" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">12-Month Invoiced vs</text>
    <text x="1182" y="360" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Collected Cashflow</text>
  </g>

  <!-- Target 4: RFQ Pipeline -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="425" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="452" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">12-Month RFQ -&gt; Quote -&gt;</text>
    <text x="1182" y="470" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Order Pipeline</text>
  </g>

  <!-- Target 5: Industry Sector -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="535" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="570" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Industry Sector Distribution</text>
  </g>

  <!-- Target 6: KPIs -->
  <g filter="url(#card-shadow)">
    <rect x="1035" y="645" width="295" height="60" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="1182" y="672" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Executive KPIs (OTD %,</text>
    <text x="1182" y="690" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Yield %, Lead Time)</text>
  </g>
</svg>
