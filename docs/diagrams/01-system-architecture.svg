<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background-color: #121316; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Client Tier -->
  <rect x="40" y="30" width="300" height="750" rx="10" fill="#222429" stroke="#383b42" stroke-width="1.5"/>
  <text x="60" y="65" fill="#9ca3af" font-size="14" font-weight="600">Client Tier (React 19 + TS)</text>

  <g filter="url(#card-shadow)">
    <rect x="60" y="95" width="260" height="75" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="190" y="125" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Public Marketing Website</text>
    <text x="190" y="148" fill="#9ca3af" font-size="11.5" text-anchor="middle">/, /products, /capabilities, /quote</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="60" y="270" width="260" height="85" rx="6" fill="#18191c" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="190" y="300" fill="#60a5fa" font-size="13.5" font-weight="700" text-anchor="middle">Customer Portal</text>
    <text x="190" y="322" fill="#9ca3af" font-size="11.5" text-anchor="middle">/customer/* (RFQs, Quotes, Orders,</text>
    <text x="190" y="340" fill="#9ca3af" font-size="11.5" text-anchor="middle">Tracking, Invoices, Sessions)</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="60" y="450" width="260" height="85" rx="6" fill="#18191c" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="190" y="480" fill="#a78bfa" font-size="13.5" font-weight="700" text-anchor="middle">Engineer MES Board</text>
    <text x="190" y="502" fill="#9ca3af" font-size="11.5" text-anchor="middle">/admin/production (25-Stage</text>
    <text x="190" y="520" fill="#9ca3af" font-size="11.5" text-anchor="middle">Kanban, Drawings, QC Reports)</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="60" y="630" width="260" height="85" rx="6" fill="#18191c" stroke="#f97316" stroke-width="1.5"/>
    <text x="190" y="660" fill="#fb923c" font-size="13.5" font-weight="700" text-anchor="middle">Executive ERP Admin</text>
    <text x="190" y="682" fill="#9ca3af" font-size="11.5" text-anchor="middle">/admin/* (Analytics, Products,</text>
    <text x="190" y="700" fill="#9ca3af" font-size="11.5" text-anchor="middle">Users, Invoicing, Audit Logs)</text>
  </g>

  <!-- 2. API & Gateway Tier -->
  <rect x="375" y="30" width="310" height="750" rx="10" fill="#222429" stroke="#383b42" stroke-width="1.5"/>
  <text x="395" y="65" fill="#9ca3af" font-size="14" font-weight="600">API Gateway (ASP.NET Core 9)</text>

  <g filter="url(#card-shadow)">
    <rect x="395" y="110" width="270" height="80" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="530" y="142" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">JWT Authentication &amp;</text>
    <text x="530" y="164" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Claims Validation</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="395" y="275" width="270" height="80" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="530" y="307" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Rate Limiter &amp; Security</text>
    <text x="530" y="329" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">Headers Middleware</text>
  </g>

  <g filter="url(#card-shadow)">
