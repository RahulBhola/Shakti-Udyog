    <text x="875" y="123" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Product Master Service</text>
    <text x="875" y="143" fill="#9ca3af" font-size="11" text-anchor="middle">Catalog Upsert &amp; 3D Card Specs</text>
