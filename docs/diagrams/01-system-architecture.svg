    <text x="875" y="333" fill="#9ca3af" font-size="11" text-anchor="middle">GST Billing &amp; Payment Receipts</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="740" y="380" width="270" height="65" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="875" y="408" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Analytics Aggregation Engine</text>
    <text x="875" y="428" fill="#9ca3af" font-size="11" text-anchor="middle">12-Month Multi-Dimensional Metrics</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="740" y="475" width="270" height="65" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="875" y="503" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Auth &amp; Session Manager</text>
    <text x="875" y="523" fill="#9ca3af" font-size="11" text-anchor="middle">Rotated Tokens &amp; Security Audits</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="740" y="570" width="270" height="65" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="875" y="598" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">CAD &amp; Document Service</text>
    <text x="875" y="618" fill="#9ca3af" font-size="11" text-anchor="middle">Sanitized Blob File Storage</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="740" y="665" width="270" height="65" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="875" y="693" fill="#f3f4f6" font-size="12.5" font-weight="600" text-anchor="middle">Realtime Broadcast Service</text>
    <text x="875" y="713" fill="#9ca3af" font-size="11" text-anchor="middle">PortalPush &amp; Client Sync</text>
  </g>

  <!-- 4. Persistence Tier -->
  <rect x="1065" y="30" width="295" height="750" rx="10" fill="#222429" stroke="#383b42" stroke-width="1.5"/>
  <text x="1085" y="65" fill="#9ca3af" font-size="14" font-weight="600">Persistence &amp; Storage</text>

  <g filter="url(#card-shadow)">
    <rect x="1085" y="160" width="255" height="180" rx="6" fill="#18191c" stroke="#10b981" stroke-width="1.5"/>
    <text x="1212" y="195" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Microsoft SQL Server</text>
    <text x="1212" y="222" fill="#f3f4f6" font-size="12" text-anchor="middle">AppDbContext</text>
    <text x="1212" y="247" fill="#9ca3af" font-size="11.5" text-anchor="middle">24 Domain Tables</text>
    <text x="1212" y="268" fill="#9ca3af" font-size="11.5" text-anchor="middle">36 Active Migrations</text>
    <text x="1212" y="290" fill="#9ca3af" font-size="11.5" text-anchor="middle">Relational Foreign Keys</text>
    <text x="1212" y="312" fill="#9ca3af" font-size="11.5" text-anchor="middle">High-Performance Indexes</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="1085" y="470" width="255" height="150" rx="6" fill="#18191c" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1212" y="505" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Protected Blob Storage</text>
    <text x="1212" y="535" fill="#f3f4f6" font-size="12" text-anchor="middle">Sanitized GUID File Keys</text>
    <text x="1212" y="560" fill="#9ca3af" font-size="11.5" text-anchor="middle">2D/3D CAD Models (.STEP, .DWG)</text>
    <text x="1212" y="582" fill="#9ca3af" font-size="11.5" text-anchor="middle">Test Certs &amp; Quality Dossiers</text>
    <text x="1212" y="604" fill="#9ca3af" font-size="11.5" text-anchor="middle">GST Invoices &amp; Payment Receipts</text>
  </g>

  <!-- Connectors between Tiers -->
  <path d="M 320 312 C 347 312, 367 315, 395 315" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="395" cy="315" r="3.5" fill="#9ca3af"/>

  <path d="M 320 492 C 347 492, 367 487, 395 487" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="395" cy="487" r="3.5" fill="#9ca3af"/>

  <path d="M 320 672 C 347 672, 367 667, 395 667" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="395" cy="667" r="3.5" fill="#9ca3af"/>

  <path d="M 665 487 C 692 487, 712 412, 740 412" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="740" cy="412" r="3.5" fill="#9ca3af"/>

  <path d="M 1010 412 C 1037 412, 1057 250, 1085 250" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="1085" cy="250" r="3.5" fill="#9ca3af"/>
</svg>
