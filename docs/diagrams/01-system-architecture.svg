    <text x="530" y="475" fill="#f3f4f6" font-size="13" font-weight="600" text-anchor="middle">REST API Controllers</text>
    <text x="530" y="497" fill="#9ca3af" font-size="11.5" text-anchor="middle">/api/v1/auth, /admin, /public,</text>
    <text x="530" y="515" fill="#9ca3af" font-size="11.5" text-anchor="middle">/customer, /engineer</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="395" y="625" width="270" height="85" rx="6" fill="#18191c" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="530" y="655" fill="#67e8f9" font-size="13.5" font-weight="700" text-anchor="middle">SignalR Realtime Gateway</text>
    <text x="530" y="677" fill="#9ca3af" font-size="11.5" text-anchor="middle">/hubs/portal (Stage Changes,</text>
    <text x="530" y="695" fill="#9ca3af" font-size="11.5" text-anchor="middle">Session Revocation, Quotes)</text>
  </g>

