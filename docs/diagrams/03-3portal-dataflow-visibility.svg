<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background-color: #121316; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Customer Portal -->
  <rect x="40" y="30" width="410" height="750" rx="10" fill="#222429" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="65" fill="#60a5fa" font-size="15" font-weight="700">1. Customer Portal (Role: Customer)</text>

  <g filter="url(#card-shadow)">
    <rect x="65" y="90" width="360" height="100" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="118" fill="#f3f4f6" font-size="13" font-weight="700">Submit RFQs &amp; Technical Drawings</text>
    <text x="85" y="142" fill="#9ca3af" font-size="11.5">• Upload 2D/3D CAD (.STEP, .PDF, .DWG)</text>
    <text x="85" y="162" fill="#9ca3af" font-size="11.5">• Specify Material Grade, Tolerances &amp; Quantities</text>
    <text x="85" y="180" fill="#9ca3af" font-size="11.5">• Track Review &amp; Quotation Status in Real Time</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="65" y="225" width="360" height="100" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="253" fill="#f3f4f6" font-size="13" font-weight="700">Review &amp; Accept Quotations</text>
    <text x="85" y="277" fill="#9ca3af" font-size="11.5">• View Itemized Pricing, Metallurgical Specs &amp; Tax</text>
    <text x="85" y="297" fill="#9ca3af" font-size="11.5">• Download Official PDF Proposal</text>
    <text x="85" y="315" fill="#9ca3af" font-size="11.5">• One-Click Accept / Request Revision</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="65" y="360" width="360" height="110" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="388" fill="#f3f4f6" font-size="13" font-weight="700">Track 25-Stage Order Progress</text>
    <text x="85" y="412" fill="#9ca3af" font-size="11.5">• Customer Timeline &amp; Milestone Alerts</text>
    <text x="85" y="432" fill="#9ca3af" font-size="11.5">• Real-Time SignalR Shop-Floor Updates</text>
    <text x="85" y="452" fill="#9ca3af" font-size="11.5">• Promising Dispatch Dates &amp; Transporter Tracking</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="65" y="505" width="360" height="110" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="533" fill="#f3f4f6" font-size="13" font-weight="700">Invoices &amp; Payment Proofs</text>
    <text x="85" y="557" fill="#9ca3af" font-size="11.5">• Download GST Tax Invoices (PDF)</text>
    <text x="85" y="577" fill="#9ca3af" font-size="11.5">• Upload UTR / Bank Slip for Verification</text>
    <text x="85" y="597" fill="#9ca3af" font-size="11.5">• View Balance Due &amp; Payment Ledger</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="65" y="650" width="360" height="100" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="678" fill="#f3f4f6" font-size="13" font-weight="700">Security &amp; Device Sessions</text>
    <text x="85" y="702" fill="#9ca3af" font-size="11.5">• View Active Logged-In Browsers &amp; Devices</text>
    <text x="85" y="722" fill="#9ca3af" font-size="11.5">• Remote Session Revocation with SignalR Push</text>
    <text x="85" y="740" fill="#9ca3af" font-size="11.5">• Company Delivery Addresses &amp; User Profile</text>
  </g>

  <!-- 2. Engineer Portal -->
  <rect x="495" y="30" width="410" height="750" rx="10" fill="#222429" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="515" y="65" fill="#a78bfa" font-size="15" font-weight="700">2. Engineer Portal (Role: Engineer)</text>

  <g filter="url(#card-shadow)">
    <rect x="520" y="110" width="360" height="120" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="540" y="138" fill="#f3f4f6" font-size="13" font-weight="700">Review RFQs &amp; Specs</text>
    <text x="540" y="162" fill="#9ca3af" font-size="11.5">• Technical Drawing &amp; CAD Review</text>
    <text x="540" y="182" fill="#9ca3af" font-size="11.5">• Feasibility Study (Grey vs SG Ductile Iron)</text>
    <text x="540" y="202" fill="#9ca3af" font-size="11.5">• Gating, Risering &amp; Pattern Methoding</text>
    <text x="540" y="220" fill="#9ca3af" font-size="11.5">• Approve / Reject / Request Customer Clarification</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="520" y="270" width="360" height="120" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="540" y="298" fill="#f3f4f6" font-size="13" font-weight="700">Generate Formal Quotations</text>
    <text x="540" y="322" fill="#9ca3af" font-size="11.5">• Itemized Costing (Metal, Moulding, Machining)</text>
    <text x="540" y="342" fill="#9ca3af" font-size="11.5">• Commercial Terms &amp; Lead Time Estimation</text>
    <text x="540" y="362" fill="#9ca3af" font-size="11.5">• Revision History &amp; PDF Generation</text>
    <text x="540" y="380" fill="#9ca3af" font-size="11.5">• Issue Directly to Customer Portal</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="520" y="430" width="360" height="150" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="540" y="458" fill="#f3f4f6" font-size="13" font-weight="700">25-Stage MES Manufacturing Board</text>
    <text x="540" y="482" fill="#9ca3af" font-size="11.5">• Drag-and-Drop / Step-wise Kanban Progression</text>
    <text x="540" y="502" fill="#9ca3af" font-size="11.5">• Stage Validations (Melt Temp, Hardness, Dimensions)</text>
    <text x="540" y="522" fill="#9ca3af" font-size="11.5">• Automatic Customer Notification Dispatches</text>
    <text x="540" y="542" fill="#9ca3af" font-size="11.5">• Internal Foundry Notes (Hidden from Customers)</text>
    <text x="540" y="562" fill="#9ca3af" font-size="11.5">• Work Order Assignment to Shift Technicians</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="520" y="615" width="360" height="135" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="540" y="643" fill="#f3f4f6" font-size="13" font-weight="700">Quality Inspection &amp; CMM Logs</text>
    <text x="540" y="667" fill="#9ca3af" font-size="11.5">• Chemical Spectrometer Test Results</text>
    <text x="540" y="687" fill="#9ca3af" font-size="11.5">• Tensile, Hardness &amp; Microstructure Logs</text>
    <text x="540" y="707" fill="#9ca3af" font-size="11.5">• CMM Dimensional Reports &amp; NDT Certificates</text>
    <text x="540" y="727" fill="#9ca3af" font-size="11.5">• Sign-Off for Packaging &amp; Dispatch</text>
  </g>

  <!-- 3. Admin Executive Portal -->
  <rect x="950" y="30" width="410" height="750" rx="10" fill="#222429" stroke="#f97316" stroke-width="1.5"/>
  <text x="970" y="65" fill="#fb923c" font-size="15" font-weight="700">3. Admin Executive Portal (Role: Admin)</text>

  <g filter="url(#card-shadow)">
    <rect x="975" y="90" width="360" height="120" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="995" y="118" fill="#f3f4f6" font-size="13" font-weight="700">8-Chart Intelligence Command Center</text>
    <text x="995" y="142" fill="#9ca3af" font-size="11.5">• Invoiced vs Realized Cashflow Dual Area Chart</text>
    <text x="995" y="162" fill="#9ca3af" font-size="11.5">• 12-Month Commercial Pipeline Bar Chart</text>
    <text x="995" y="182" fill="#9ca3af" font-size="11.5">• MES Kanban Stage &amp; Metallurgy Mix Donut</text>
    <text x="995" y="200" fill="#9ca3af" font-size="11.5">• Live Executive OTD, Yield &amp; Win Rate Badges</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="975" y="240" width="360" height="120" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="995" y="268" fill="#f3f4f6" font-size="13" font-weight="700">Product Master &amp; Public Sync</text>
    <text x="995" y="292" fill="#9ca3af" font-size="11.5">• Master Product Catalog CRUD &amp; Image Storage</text>
    <text x="995" y="312" fill="#9ca3af" font-size="11.5">• View Mode Switcher (3D Cards vs Table Grid)</text>
    <text x="995" y="332" fill="#9ca3af" font-size="11.5">• Real-Time Sync with Public Marketing Site</text>
    <text x="995" y="350" fill="#9ca3af" font-size="11.5">• Category, Industry &amp; Standard Cost Controls</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="975" y="390" width="360" height="100" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="995" y="418" fill="#f3f4f6" font-size="13" font-weight="700">Users, Companies &amp; RBAC</text>
    <text x="995" y="442" fill="#9ca3af" font-size="11.5">• Corporate Account Approval &amp; Credit Limits</text>
    <text x="995" y="462" fill="#9ca3af" font-size="11.5">• Engineer Profile &amp; Role Management</text>
    <text x="995" y="480" fill="#9ca3af" font-size="11.5">• Global Session Revocations &amp; Password Resets</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="975" y="520" width="360" height="110" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="995" y="548" fill="#f3f4f6" font-size="13" font-weight="700">Financial Invoicing &amp; Payments</text>
    <text x="995" y="572" fill="#9ca3af" font-size="11.5">• GST Tax Invoice Generation &amp; Overdue Tracking</text>
    <text x="995" y="592" fill="#9ca3af" font-size="11.5">• UTR Payment Verification &amp; Bank Reconciliation</text>
    <text x="995" y="612" fill="#9ca3af" font-size="11.5">• Shipment Creation &amp; Proof of Delivery (POD)</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="975" y="660" width="360" height="90" rx="6" fill="#18191c" stroke="#4b5563" stroke-width="1.2"/>
    <text x="995" y="688" fill="#f3f4f6" font-size="13" font-weight="700">Security &amp; Audit Trail</text>
    <text x="995" y="712" fill="#9ca3af" font-size="11.5">• Immutable System Event &amp; Access Logs</text>
    <text x="995" y="732" fill="#9ca3af" font-size="11.5">• Financial &amp; Operational Reports Export (PDF/CSV)</text>
  </g>
</svg>
