<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14171b" />
    <title>Shakti Udyog | Iron Casting Manufacturer in Ludhiana</title>
    <meta name="description" content="Shakti Udyog supplies grey iron, ductile iron, and custom industrial castings for OEMs and engineering applications in Ludhiana, India. Request a quote." />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('shakti-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
